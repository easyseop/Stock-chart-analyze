<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="전략 A/B 신호와 KIS 보유종목·성과 차트를 보여주는 읽기 전용 대시보드">
  <meta name="theme-color" content="#f5f7fb">
  <meta property="og:title" content="Flow — 읽기 전용 종목 스크리너">
  <meta property="og:description" content="전략 A/B 진입 후보와 시장 대비 성과를 한눈에 확인하세요.">
  <meta property="og:image" content="https://easyseop.github.io/Stock-chart-analyze/app/og-v2.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Flow — 읽기 전용 종목 스크리너">
  <meta name="twitter:description" content="전략 A/B 진입 후보와 시장 대비 성과를 한눈에 확인하세요.">
  <meta name="twitter:image" content="https://easyseop.github.io/Stock-chart-analyze/app/og-v2.png">
  <title>Flow · 종목 스크리너</title>
  <link rel="stylesheet" href="app.css">
  <script src="portfolio_math.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="side-nav" aria-label="주요 메뉴">
      <a class="brand" href="#briefing" aria-label="Flow 홈">
        <span class="brand-mark">F</span>
        <span>flow</span>
      </a>
      <nav class="nav-stack">
        <button class="nav-item active" data-view="briefing" type="button">
          <span class="nav-icon">⌂</span><span>오늘 브리핑</span>
        </button>
        <button class="nav-item" data-view="now" type="button">
          <span class="nav-icon">A</span><span>전략 A</span>
        </button>
        <button class="nav-item" data-view="watch" type="button">
          <span class="nav-icon">◎</span><span>A 관찰</span>
        </button>
        <button class="nav-item" data-view="shelf" type="button">
          <span class="nav-icon">▤</span><span>전략 B</span>
        </button>
        <button class="nav-item" data-view="portfolio" type="button">
          <span class="nav-icon">◫</span><span>내 자산</span>
        </button>
        <button class="nav-item" data-view="performance" type="button">
          <span class="nav-icon">↗</span><span>지수 비교</span>
        </button>
      </nav>
      <div class="side-note">
        <span class="readonly-dot"></span>
        주문 기능 없는<br>읽기 전용 화면
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="page-eyebrow">TODAY · DECISION BRIEF</p>
          <h1 id="page-title">오늘 브리핑</h1>
        </div>
        <div class="top-actions">
          <span class="freshness neutral" id="freshness">데이터 확인 중</span>
          <button class="icon-button" id="refresh-button" type="button" aria-label="데이터 새로고침">↻</button>
          <button class="icon-button" id="theme-button" type="button" aria-label="화면 테마 변경">◐</button>
        </div>
      </header>

      <div class="alert hidden" id="data-alert" role="status"></div>

      <section class="hero" id="hero">
        <div class="hero-copy">
          <span class="hero-kicker" id="hero-kicker">오늘 포착된 흐름</span>
          <div class="hero-number-row">
            <strong id="hero-number">—</strong>
            <span id="hero-unit">종목</span>
          </div>
          <p id="hero-description">스크리너가 발행한 신호를 불러오고 있어요.</p>
        </div>
        <div class="hero-orbit" aria-hidden="true">
          <span class="orbit-ring ring-one"></span>
          <span class="orbit-ring ring-two"></span>
          <span class="orbit-dot dot-one"></span>
          <span class="orbit-dot dot-two"></span>
          <span class="orbit-core"></span>
        </div>
      </section>

      <section class="toolbar" id="signal-toolbar">
        <label class="search">
          <span aria-hidden="true">⌕</span>
          <span class="sr-only">종목 검색</span>
          <input id="search-input" type="search" placeholder="종목명 또는 코드 검색" autocomplete="off">
        </label>
        <div class="filter-row" aria-label="신호 필터">
          <button class="filter-chip active" data-market="all" type="button">전체</button>
          <button class="filter-chip" data-market="KRW" type="button">한국</button>
          <button class="filter-chip" data-market="USD" type="button">미국</button>
        </div>
        <label class="sort-select">
          <span class="sr-only">정렬 방법</span>
          <select id="sort-select">
            <option value="stage">전환 단계순</option>
            <option value="fresh">새 신호 우선</option>
            <option value="range">저점 근접순</option>
            <option value="name">이름순</option>
          </select>
        </label>
      </section>

      <section id="content" aria-live="polite">
        <div class="loading-grid" aria-label="데이터 로딩 중">
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>
      </section>

      <footer class="footer">
        <p id="disclaimer">차트 기반 정보이며 투자권유가 아닙니다. 주문 전 가격과 체결 가능성을 다시 확인하세요.</p>
        <a href="../index.html">기존 스크리너로 돌아가기</a>
      </footer>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="모바일 주요 메뉴">
    <button class="bottom-item active" data-view="briefing" type="button"><span>⌂</span><small>오늘</small></button>
    <button class="bottom-item" data-view="now" type="button"><span>A</span><small>전략 A</small></button>
    <button class="bottom-item" data-view="watch" type="button"><span>◎</span><small>A 관찰</small></button>
    <button class="bottom-item" data-view="shelf" type="button"><span>▤</span><small>전략 B</small></button>
    <button class="bottom-item" data-view="portfolio" type="button"><span>◫</span><small>내 자산</small></button>
    <button class="bottom-item" data-view="performance" type="button"><span>↗</span><small>지수</small></button>
  </nav>

  <dialog class="detail-dialog" id="detail-dialog">
    <div class="dialog-head">
      <div>
        <span class="detail-market" id="detail-market"></span>
        <h2 id="detail-title"></h2>
      </div>
      <button class="dialog-close" id="dialog-close" type="button" aria-label="상세 닫기">×</button>
    </div>
    <div id="detail-content"></div>
  </dialog>

  <noscript>
    <div class="noscript">이 사이트는 공개 JSON을 화면에 표시하기 위해 JavaScript가 필요합니다.</div>
  </noscript>
</body>
</html>
