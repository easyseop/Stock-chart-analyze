<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 전환 후보 — 종목 스크리너</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#191f28;--sub:#8b95a1;--line:#f2f4f6;
    --accent:#2e6be6;--up:#f04452;--down:#3182f6;--soft:#eef1f5}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,'Segoe UI','Noto Sans KR',sans-serif;
    background:var(--bg);color:var(--ink)}
  a{color:inherit}
  header{background:var(--card);padding:14px 20px 12px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px}
  header h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.3px;flex:1}
  header h1 small{color:var(--sub);font-size:12px;font-weight:600;margin-left:8px}
  .topnav{display:flex;gap:4px}
  .topnav a{text-decoration:none;font-size:13.5px;font-weight:700;color:#4e5968;
    padding:7px 12px;border-radius:9px}
  .topnav a.on{background:var(--soft);color:var(--ink)}
  /* ── 하단 탭바(모바일) ── */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;
    background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
    border-top:1px solid #e8ebee;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{flex:1;text-align:center;text-decoration:none;font-size:11px;font-weight:700;
    color:#8b95a1;padding:4px 0 2px;border-radius:10px}
  .tabbar a .ti{display:block;font-size:20px;line-height:1.15}
  .tabbar a.on{color:var(--accent)}
  @media(max-width:640px){
    .tabbar{display:flex}
    .topnav{display:none}
    body{padding-bottom:64px}
    header h1{font-size:16.5px} header h1 small{display:none}
  }
  main{max-width:760px;margin:0 auto}
  main.wide{max-width:none}
  /* ═══ 홈 — 오늘의 답 ═══ */
  .mkline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px 0;
    font-size:12.5px;color:#4e5968;font-weight:600}
  .mkline .dot{width:7px;height:7px;border-radius:50%;background:#16a34a;display:inline-block}
  .board{display:flex;gap:8px;padding:12px 16px 2px}
  .bcell{flex:1;background:var(--card);border-radius:14px;padding:12px 6px;text-align:center;
    border:1px solid #eceff3;text-decoration:none;color:inherit}
  .bcell b{display:block;font-size:21px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .bcell span{font-size:11.5px;color:var(--sub);font-weight:600}
  .bcell.now b{color:var(--up)} .bcell.watch b{color:#c2410c} .bcell.trk b{color:var(--accent)}
  .hsec{padding:16px 18px 6px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:7px}
  .hsec .cnt{color:var(--sub);font-size:12px;font-weight:700}
  .hsec .rmk{margin-left:auto;font-size:11.5px;color:var(--sub);font-weight:600}
  /* 픽 카드 */
  .pk{background:var(--card);border-radius:16px;border:1px solid #eceff3;
    margin:0 14px 10px;padding:14px 15px}
  .pk .top{display:flex;align-items:flex-start;gap:8px}
  .pk .nm{flex:1;min-width:0}
  .pk .nm a{font-size:15.5px;font-weight:800;text-decoration:none;color:var(--ink);
    line-height:1.3;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pk .nm .cd{font-size:11px;color:var(--sub);font-weight:600}
  .pk .px{text-align:right;flex:0 0 auto}
  .pk .px b{display:block;font-size:15.5px;font-variant-numeric:tabular-nums}
  .pk .px span{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
  .pk .tags{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 0}
  .tg{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft);color:#4e5968}
  .tg.hot{background:#fff1eb;color:#d84910}
  .tg.stale{background:var(--soft);color:#8b95a1}
  .tg.st{background:#eaf3ff;color:#1d6ce0}
  .tg.rec{background:#fff8e5;color:#b45309}
  .tg.wait{background:#fff8e5;color:#b45309}
  /* 저점권 미터 */
  .zone{margin:12px 0 4px}
  .zl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--sub);
    font-weight:600;margin-bottom:4px}
  .zbar{position:relative;height:8px;border-radius:999px;background:#e8ebf0}
  .zbar .band{position:absolute;left:0;top:0;bottom:0;border-radius:999px 0 0 999px;
    background:rgba(49,130,246,.22)}
  .zbar .zdot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;
    background:var(--accent);border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);
    transform:translate(-50%,-50%)}
  /* 계획 3칸 */
  .lvl{display:flex;gap:6px;margin:10px 0 0}
  .lv{flex:1;background:#f8f9fb;border-radius:10px;padding:8px 4px;text-align:center}
  .lv span{display:block;font-size:10.5px;color:var(--sub);font-weight:700}
  .lv b{font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
  .lv.e b{color:var(--ink)} .lv.s b{color:var(--up)} .lv.t b{color:#16a34a}
  .pk .why{font-size:12.5px;color:#4e5968;line-height:1.6;margin:10px 2px 0}
  .pk .why b{color:var(--ink)}
  .pk .cta{display:flex;gap:8px;margin-top:12px}
  .pk .cta a{flex:1;text-align:center;text-decoration:none;font-size:13.5px;font-weight:800;
    padding:11px 0;border-radius:11px}
  .pk .cta .c1{background:var(--accent);color:#fff}
  .pk .cta .c2{background:var(--soft);color:#334155}
  /* 곧 올 자리 — 컴팩트 행 */
  .soon{background:var(--card);border-radius:16px;border:1px solid #eceff3;margin:0 14px 10px;overflow:hidden}
  .sr{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line);
    text-decoration:none}
  .sr:last-child{border-bottom:0}
  .sr .fl{font-size:14px}
  .sr .n{flex:1;min-width:0}
  .sr .n b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sr .n span{font-size:11px;color:var(--sub);font-weight:600}
  .sr .zp{font-size:11.5px;font-weight:700;color:#1d6ce0;background:#eaf3ff;
    padding:3px 8px;border-radius:999px;flex:0 0 auto}
  .sr .p{text-align:right;flex:0 0 auto}
  .sr .p b{display:block;font-size:13.5px;font-variant-numeric:tabular-nums}
  .sr .p span{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
  .hstat{margin:2px 16px 10px;font-size:12px;color:#4e5968;background:var(--card);
    border:1px solid #eceff3;border-radius:12px;padding:9px 12px;line-height:1.6}
  .hstat b{color:var(--ink)}
  .hmuted{margin:0 16px 14px;font-size:11.5px;color:var(--sub);line-height:1.6}
  .hmuted a{color:#15803d;font-weight:700}
  .pos{color:var(--up)}.neg{color:var(--down)}
  /* ═══ 종목 탭(스크리너) ═══ */
  #v-stocks{display:none}
  .chipbar{padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{border:1px solid #e5e8eb;background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;
    cursor:pointer;font-size:13px}
  .chip.on{background:var(--down);border-color:var(--down);color:#fff}
  table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
  th,td{padding:8px 10px;border-bottom:1px solid #eef2f7;text-align:right}
  th{background:#f8fafc;color:#64748b;font-size:12px;position:sticky;top:0;cursor:pointer;
    user-select:none}
  th:nth-child(2),td.nm{text-align:left}
  td.vd{text-align:left;color:#475569;max-width:360px}
  td.sc{font-weight:700}
  .num{font-variant-numeric:tabular-nums}
  td.stg{text-align:left;color:#16a34a;font-weight:600;font-size:12px}
  .nm a{color:#1d4ed8;text-decoration:none;font-weight:600}
  .nm .ko{color:#475569;font-size:12px;margin-left:6px}
  .nm .cd{color:#94a3b8;font-size:11px;margin-left:6px}
  td.sc.pos,.num.pos{color:var(--up)}
  td.sc.neg,.num.neg{color:var(--down)}
  tr.rec{background:#fffbeb}
  .sig{display:inline-flex;align-items:center;gap:5px}
  .star{font-size:11px;font-weight:700;color:#d97706}
  .rec-chip{background:#fef3c7;border-color:#f59e0b;color:#92400e;font-weight:700}
  .rec-chip.on{background:#f59e0b;border-color:#f59e0b;color:#fff}
  .bar2{padding-top:0} .barlbl{font-size:12px;color:#94a3b8;font-weight:600;align-self:center}
  .stagechip{background:#ecfdf5;border-color:#a7f3d0;color:#065f46;font-size:12px}
  .stagechip.on{background:#16a34a;border-color:#16a34a;color:#fff}
  .holdchip{background:#fffbeb;border-color:#f59e0b;color:#92400e;font-weight:700}
  .holdchip.on{background:#f59e0b;border-color:#f59e0b;color:#fff}
  .rgnchip{background:#f8fafc;font-weight:700}
  .rgnchip.on{background:#334155;border-color:#334155;color:#fff}
  .rgn{font-size:12px;margin-right:4px;vertical-align:middle}
  .hold{border:0;background:none;cursor:pointer;font-size:16px;color:#cbd5e1;padding:0 6px 0 0;
    line-height:1;vertical-align:middle}
  .hold.on{color:#f59e0b}
  .pl{font-size:11.5px;font-weight:700;margin-left:7px;white-space:nowrap}
  .pl.up{color:var(--up)} .pl.dn{color:var(--down)}
  .pxm{display:none}
  tr.held{background:#fffdf3}
  .search{position:sticky;top:0;z-index:9;padding:8px 16px;display:flex;
    align-items:center;gap:8px;background:var(--bg);border-bottom:1px solid #e5e8eb}
  .search input{flex:1;box-sizing:border-box;padding:12px 38px 12px 14px;border:1px solid #cbd5e1;
    border-radius:10px;font-size:16px;background:#fff}
  .search input:focus{outline:none;border-color:var(--down)}
  .search .qwrap{flex:1;position:relative;display:flex}
  .search #qx{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;
    background:#e5e8eb;color:#64748b;border-radius:50%;width:24px;height:24px;line-height:1;
    font-size:13px;cursor:pointer;display:none}
  .qn{font-size:12px;color:#64748b;white-space:nowrap}
  .stat{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 16px 8px;
    font-size:12.5px;color:#475569}
  .stat b{color:var(--ink)}
  .stat .rstbtn{border:1px solid #e5e8eb;background:#fff;border-radius:999px;padding:3px 10px;
    font-size:11.5px;color:#64748b;cursor:pointer;display:none}
  #morew{display:none;padding:10px 16px 24px;background:#fff}
  #more{width:100%;padding:12px;border:1px solid #e5e8eb;border-radius:10px;background:#f8fafc;
    color:#334155;font-size:13.5px;font-weight:700;cursor:pointer}
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  #tb tr{content-visibility:auto;contain-intrinsic-size:auto 44px}
  td.brk{display:none}
  /* 인앱 모달 — prompt() 대체 */
  #mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:none;
    align-items:flex-end;justify-content:center}
  #mask.show{display:flex}
  .sheet{background:#fff;border-radius:16px 16px 0 0;padding:18px 18px 22px;width:100%;
    max-width:480px}
  .sheet h3{margin:0 0 6px;font-size:16px}
  .sheet p{margin:0 0 12px;font-size:13px;color:#475569;line-height:1.6;white-space:pre-line}
  .sheet input{width:100%;padding:12px;border:1px solid #cbd5e1;
    border-radius:10px;font-size:16px;margin-bottom:12px}
  .sheet .btns{display:flex;gap:8px}
  .sheet .btns button{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
  #mok{border:0;background:var(--down);color:#fff}
  #mno{border:1px solid #e5e8eb;background:#fff;color:#475569}
  @media(min-width:641px){#mask{align-items:center}.sheet{border-radius:16px}
    .board{max-width:760px} .pk .cta a{max-width:none}}
  /* 모바일 종목 리스트: 토스식 2줄 */
  @media(max-width:640px){
    .chip{padding:6px 11px;font-size:12px}
    .tw{overflow:visible;background:#fff;margin-top:8px}
    thead{display:none}
    #tb tr{contain-intrinsic-size:auto 64px}
    table,tbody{display:block}
    tr{display:flex;flex-wrap:wrap;align-items:center;position:relative;
       background:#fff;border:0;border-bottom:1px solid var(--line);
       margin:0;padding:12px 16px}
    tr:active{background:#f8f9fa}
    tr.rec{background:#fffdf5}
    td{display:none;border:0;padding:0;font-size:12px;text-align:left}
    td::before{display:none}
    td.nm{display:flex;align-items:center;order:1;flex-basis:100%;gap:2px}
    td.nm a{font-size:15.5px;font-weight:700;line-height:1.3;color:var(--ink);
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52vw}
    td.nm .ko,td.nm .cd{display:none}
    td.nm .pl{margin-left:6px}
    .pxm{display:flex;flex-direction:column;align-items:flex-end;margin-left:auto;
       flex:0 0 auto}
    .pxm .pxv{font-size:15px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
    .pxm .pxc{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
    td[data-label="신호"],td.stg,td[data-label="저점권"]{
       display:block;order:2;flex:0 0 auto;color:#8b95a1;font-size:11.5px;
       font-weight:600;background:none;padding:2px 8px 0 0}
    td.stg{color:var(--up)}
    td[data-v="0"].stg,td[data-v=""].stg{display:none}
    td[data-label="저점권"]::before{content:"저점권 ";display:inline;color:#8b95a1;
       font-size:11.5px;font-weight:600}
    td[data-label="저점권"].pos{color:var(--down)}
    td[data-label="저점권"].neg{color:#8b95a1}
  }
</style></head><body>
<header>
  <h1>📉→📈 전환 스크리너<small>하락→상승 전환을 저점에서</small></h1>
  <nav class="topnav">
    <a href="#home" id="nav-home" class="on" onclick="return go('home')">홈</a>
    <a href="#stocks" id="nav-stocks" onclick="return go('stocks')">종목</a>
    <a href="paper.html">모의투자</a>
    <a href="more.html">더보기</a>
  </nav>
</header>

<main id="v-home">
  <div class="mkline"><span class="dot" id="agedot"></span>
    <span id="age" data-ts="__UPDATED_TS__"></span>__MKLINE__</div>
  __HOME__
</main>

<main id="v-stocks" class="wide">
  <div class="search">
    <div class="qwrap">
      <input id="q" type="search" inputmode="search" autocomplete="off" aria-label="종목 검색"
        placeholder="🔍 종목 검색 (티커·영문명·한글명)" oninput="search(this.value)">
      <button id="qx" aria-label="검색어 지우기" onclick="clearQ()">✕</button>
    </div>
    <span id="qn" class="qn" aria-live="polite"></span>
  </div>
  <div class="chipbar">
    <button class="chip rec-chip" data-f="rec" aria-pressed="false" onclick="chip(this)">⭐ 진입 추천 __RCOUNT__</button>
    <button class="chip" data-f="all" aria-pressed="false" onclick="chip(this)">전체</button>
    __REGION_CHIPS__
    __CHIPS__
  </div>
  <div class="chipbar bar2"><span class="barlbl">전환단계</span>__STAGE_CHIPS__
    <button class="chip holdchip" id="holdchip" data-f="hold" aria-pressed="false" onclick="chip(this)" style="display:none">💼 내 종목 <span id="holdn">0</span></button>
    <a class="chip" href="lookup.html" style="background:#0f172a;color:#fff;border-color:#0f172a;text-decoration:none">➕ 즉석조회</a>
  </div>
  <div class="stat"><span id="cnt" aria-live="polite"></span>
    <button class="rstbtn" id="rstbtn" onclick="resetF()">필터 초기화 ↺</button></div>
  <div class="tw"><table id="t"><thead><tr>
    <th onclick="srt(0,false)">신호</th>
    <th onclick="srt(1,false)">종목</th>
    <th onclick="srt(2,true)">전환단계▼</th>
    <th onclick="srt(3,false)">추세</th>
    <th onclick="srt(4,true)">점수</th>
    <th onclick="srt(5,false)">시장</th>
    <th onclick="srt(6,true)">RS</th>
    <th onclick="srt(7,true)">신고가</th>
    <th onclick="srt(8,true)" title="52주 저가~고가 범위 내 현재가 위치 — 낮을수록 저점">저점권</th>
    <th onclick="srt(9,false)">판정</th>
  </tr></thead><tbody id="tb"></tbody></table></div>
  <div id="morew"><button id="more" onclick="more()"></button></div>
</main>

<template id="rowsrc">__ROWS__</template>
<div id="mask" role="dialog" aria-modal="true"><div class="sheet">
  <h3 id="mtt"></h3><p id="mtx"></p>
  <input id="min" inputmode="decimal" style="display:none">
  <div class="btns"><button id="mno" onclick="mHide()">취소</button><button id="mok">확인</button></div>
</div></div>
__TABBAR__
<script>
  var tb=document.getElementById('tb');
  // ── 뷰(홈/종목) 전환 — 해시 라우팅: URL·탭제목·뒤로가기와 일치 ──
  var TITLES={home:'오늘의 전환 후보 — 종목 스크리너',stocks:'전체 종목 — 종목 스크리너'};
  function show(v){
    document.getElementById('v-home').style.display=(v==='home')?'block':'none';
    document.getElementById('v-stocks').style.display=(v==='stocks')?'block':'none';
    ['home','stocks'].forEach(function(k){
      var n=document.getElementById('nav-'+k); if(n)n.classList.toggle('on',k===v);
      var t=document.getElementById('tab-'+k); if(t)t.classList.toggle('on',k===v);
    });
    document.title=TITLES[v]||TITLES.home;
  }
  function go(v){location.hash=(v==='home')?'':'stocks';return false;}
  function route(){show(location.hash==='#stocks'?'stocks':'home');}
  window.addEventListener('hashchange',route);
  // 갱신 나이 배지 — 장 마감(주말·야간)일 땐 '오래됨' 경고 대신 마감 안내
  function mktClosed(){
    var k=new Date(Date.now()+9*3600e3);            // KST
    var d=k.getUTCDay(), hm=k.getUTCHours()*60+k.getUTCMinutes();
    if(d===0||d===6)return '주말';
    var kr=hm>=540&&hm<=930, us=hm>=1350||hm<=300;  // 09~15:30 / 22:30~05:00 KST
    return (kr||us)?'':'장 마감';
  }
  (function(){var el=document.getElementById('age');if(!el)return;var ts=+el.dataset.ts*1000;
    function f(){var m=Math.floor((Date.now()-ts)/60000);
      var closed=mktClosed();
      var t=(m<1?'방금 전':(m<60?m+'분 전':Math.floor(m/60)+'시간 전'))+' 갱신';
      if(closed)t+=' · 🌙 '+closed+'(월~금 09시 개장)'.replace('(월~금 09시 개장)',
        closed==='주말'?' — 월 09:00 개장':'');
      el.textContent=t;
      var late=!closed&&m>45;                        // 장중인데 오래됨 → 경고
      var col=closed?'#8b95a1':(late?'#d97706':'#16a34a');
      el.style.cssText='font-weight:700;color:'+col;
      var d=document.getElementById('agedot');
      if(d)d.style.background=col;}
    f();setInterval(f,30000);})();

  // ── 종목 리스트: 행은 <template>에, 매칭분만 200개씩 렌더 ──
  var ROWS=[], PAGE=200, LIMIT=PAGE, HOLD={};
  var F={rec:false, region:'', bucket:'', stage:0, hold:false, q:''};
  var BUCKET_KO={transition:'🟢 전환후보', up:'📈 상승추세', neutral:'⚪ 관망', avoid:'🔴 회피'};
  var STAGE_KO={1:'①임박',2:'②갓돌파',3:'③횡보',4:'④확정'};
  function init(){
    var t=document.getElementById('rowsrc');
    ROWS=[].slice.call(t.content.querySelectorAll('tr'));
    ROWS.forEach(function(r){
      var nm=r.querySelector('.nm');
      r._q=((nm?nm.textContent:'')+' '+(r.dataset.code||'')).toLowerCase();
    });
  }
  function dims(r){
    var d=r.dataset;
    if(F.rec && parseInt(d.rec||'0')<__RECMIN__) return false;
    if(F.region && d.region!==F.region) return false;
    if(F.bucket && d.bucket!==F.bucket) return false;
    if(F.stage && parseInt(d.stage||'0')!==F.stage) return false;
    if(F.hold && !HOLD[d.code]) return false;
    if(F.q && r._q.indexOf(F.q)<0) return false;
    return true;
  }
  function noF(){return !F.rec&&!F.region&&!F.bucket&&!F.stage&&!F.hold;}
  function desc(){
    var p=[];
    if(F.q)p.push('“'+F.q+'” 검색');
    if(F.rec)p.push('⭐추천');
    if(F.region)p.push(F.region==='kr'?'🇰🇷국내':'🇺🇸해외');
    if(F.bucket)p.push(BUCKET_KO[F.bucket]||F.bucket);
    if(F.stage)p.push(STAGE_KO[F.stage]);
    if(F.hold)p.push('💼내 종목');
    return p.length?p.join(' + ')+' — ':'';
  }
  function apply(keep){
    if(!keep)LIMIT=PAGE;
    var frag=document.createDocumentFragment(), n=0, shown=0;
    tb.textContent='';
    for(var i=0;i<ROWS.length;i++){
      if(!dims(ROWS[i]))continue; n++;
      if(shown<LIMIT){frag.appendChild(ROWS[i]);shown++;}
    }
    tb.appendChild(frag);
    document.getElementById('cnt').innerHTML=desc()+'<b>'+n.toLocaleString('ko-KR')+'</b>개'
      +(shown<n?' 중 '+shown+'개 표시':'')
      +' <span style="color:#94a3b8">/ 전체 '+ROWS.length.toLocaleString('ko-KR')+'종목</span>';
    var qn=document.getElementById('qn');
    qn.textContent=F.q?(n+'개'):'';
    var mw=document.getElementById('morew');
    if(shown<n){mw.style.display='block';
      document.getElementById('more').textContent='더보기 ▾ (남은 '+(n-shown).toLocaleString('ko-KR')+'개)';}
    else mw.style.display='none';
    document.getElementById('rstbtn').style.display=(noF()&&!F.q)?'none':'inline-block';
  }
  function more(){LIMIT+=PAGE;apply(true);}
  function chip(btn){
    var f=btn.dataset.f, v=btn.dataset.v;
    if(f==='rec')F.rec=!F.rec;
    else if(f==='hold')F.hold=!F.hold;
    else if(f==='all'){F.rec=false;F.region='';F.bucket='';F.stage=0;F.hold=false;}
    else if(f==='stage'){var s=parseInt(v);F.stage=(F.stage===s?0:s);}
    else F[f]=(F[f]===v?'':v);
    syncChips(); apply();
  }
  function syncChips(){
    [].forEach.call(document.querySelectorAll('.chip[data-f]'),function(c){
      var f=c.dataset.f,v=c.dataset.v,on=false;
      if(f==='rec')on=F.rec;
      else if(f==='hold')on=F.hold;
      else if(f==='all')on=noF();
      else if(f==='stage')on=(F.stage===parseInt(v));
      else on=(F[f]===v);
      c.classList.toggle('on',on);
      c.setAttribute('aria-pressed',on?'true':'false');
    });
  }
  function resetF(){
    F={rec:false,region:'',bucket:'',stage:0,hold:false,q:''};
    document.getElementById('q').value='';
    onQ(); syncChips(); apply();
  }
  function srt(col,num){
    ROWS.sort(function(a,b){
      var x=a.children[col],y=b.children[col];
      if(num){return parseFloat(y.dataset.v)-parseFloat(x.dataset.v);}
      return (x.textContent>y.textContent?1:-1);
    });
    // 정렬 기준 표시(▼) — 클릭한 컬럼으로 이동
    [].forEach.call(document.querySelectorAll('#t thead th'),function(th,i){
      th.textContent=th.textContent.replace('▼','')+(i===col?'▼':'');
    });
    apply(true);
  }
  var _stmr=null;
  function search(v){clearTimeout(_stmr);_stmr=setTimeout(function(){
    F.q=(v||'').trim().toLowerCase(); onQ(); apply();},120);}
  function onQ(){
    document.getElementById('qx').style.display=F.q?'block':'none';
  }
  function clearQ(){
    var q=document.getElementById('q'); q.value=''; F.q='';
    onQ(); apply(); q.focus();
  }
  // ── 인앱 모달 ──
  function mShow(o){
    document.getElementById('mtt').textContent=o.title;
    document.getElementById('mtx').textContent=o.text||'';
    var inp=document.getElementById('min');
    inp.style.display=o.input?'block':'none';
    inp.value=(o.input&&o.input.val)||''; inp.placeholder=(o.input&&o.input.ph)||'';
    document.getElementById('mok').onclick=function(){
      var v=o.input?inp.value:null; mHide(); o.onok(v);};
    document.getElementById('mask').classList.add('show');
    if(o.input)inp.focus();
  }
  function mHide(){document.getElementById('mask').classList.remove('show');}
  document.getElementById('mask').addEventListener('click',function(e){
    if(e.target===this)mHide();});
  // 💼 내 종목 — localStorage
  function loadHold(){try{return JSON.parse(localStorage.getItem('holdings')||'{}');}catch(e){return {};}}
  function saveHold(h){localStorage.setItem('holdings',JSON.stringify(h));}
  function toggleHold(e,code){
    e.preventDefault();e.stopPropagation();
    var h=loadHold();
    if(h[code]){
      mShow({title:'관심 해제',text:code+' 을(를) 내 종목에서 뺄까요?',onok:function(){
        delete h[code]; saveHold(h); HOLD=h; renderHold(); if(F.hold)apply();}});
    }else{
      var row=null;
      for(var i=0;i<ROWS.length;i++){if(ROWS[i].dataset.code===code){row=ROWS[i];break;}}
      var cur=row?parseFloat(row.dataset.price):NaN;
      mShow({title:'관심 추가 — '+code,
        text:'매수가를 넣으면 손익(P/L)을 표시해요. 비우면 즐겨찾기만.'
          +(isFinite(cur)?'\n현재가 '+cur:''),
        input:{ph:'매수가 (선택)'},
        onok:function(v){
          var buy=v?parseFloat((v+'').replace(/[^0-9.]/g,'')):0;
          h[code]={buy:isFinite(buy)?buy:0,ts:Date.now()};
          saveHold(h); HOLD=h; renderHold();}});
    }
  }
  function renderHold(){
    var h=loadHold(); HOLD=h;
    var keys=Object.keys(h);
    document.getElementById('holdn').textContent=keys.length;
    document.getElementById('holdchip').style.display=keys.length?'':'none';
    ROWS.forEach(function(r){
      var code=r.dataset.code,on=!!h[code];
      r.classList.toggle('held',on);
      var btn=r.querySelector('.hold');
      if(btn){btn.textContent=on?'★':'☆';btn.classList.toggle('on',on);
        btn.setAttribute('aria-pressed',on?'true':'false');
        btn.setAttribute('aria-label',on?'관심 해제':'관심 추가');}
      var pl=r.querySelector('.pl[data-code="'+code+'"]');
      if(pl){
        pl.className='pl';pl.innerHTML='';
        if(on&&h[code].buy){
          var cur=parseFloat(r.dataset.price);
          if(isFinite(cur)){
            var pct=(cur/h[code].buy-1)*100;
            pl.classList.add(pct>=0?'up':'dn');
            pl.innerHTML=(pct>=0?'+':'')+pct.toFixed(1)+'% '
              +'<span style="color:#94a3b8;font-weight:400">@'+h[code].buy+'</span>';
          }
        }
      }
    });
  }
  // 시작: 종목 탭 기본 필터 = ⭐추천(없으면 전환후보), 뷰는 해시 따라
  init(); renderHold();
  (function(){
    var rec=0,trans=0;
    ROWS.forEach(function(r){
      if(parseInt(r.dataset.rec||'0')>=__RECMIN__)rec++;
      if(r.dataset.bucket==='transition')trans++;});
    if(rec)F.rec=true;
    else if(trans)F.bucket='transition';
    syncChips(); apply(); route();
  })();
</script></body></html>
