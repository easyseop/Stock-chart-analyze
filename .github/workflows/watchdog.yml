name: freshness-watchdog

# 자가치유 + 경보: 라이브가 너무 오래됐으면(배포 실패·크론 지연·paths 공백 등 원인
#   불문) daily.yml을 자동 재실행하고, 텔레그램으로도 알린다.
#   "자동매매가 조용히 멈추는 것"을 막는 안전망 — 멈추면 반드시 알림이 온다.
# 신선도 판정: index.html의 data-ts(에폭초, 시간대 무관)로 계산 → KST/UTC 혼동 없음.
# ★ 장 시간을 아는 임계(2026-07-07 오탐 사고 수정): 45분 잣대를 장외에 들이대면
#   "마감(20:00 UTC)~마감후 배치(22:00 UTC)~한국장(00:00 UTC)" 사이 자연 정체가
#   전부 거짓 경보가 된다. 검사 시각(UTC 분)으로 임계를 고르고, 장외엔 검사 생략.
#   크론 발화가 지연돼 장외로 밀려도 스크립트가 스스로 생략(이중 방어).

on:
  schedule:
    - cron: "7,22,37,52 0-6,13-20,22-23 * * 1-5"  # 시간당 4회 — 드랍돼도 한 번만
                                                  # 발화하면 자가치유. 장외 시간은
                                                  # 스크립트가 자체 생략.
  workflow_dispatch:

permissions:
  actions: write        # daily.yml 재실행 트리거용

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 라이브 신선도 확인 → 오래되면 재배포 + 텔레그램 경고
        env:
          GH_TOKEN: ${{ github.token }}
          SITE: "https://easyseop.github.io/Stock-chart-analyze/index.html"
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          # ── 장 시간별 임계(분) — 0이면 검사 생략 ─────────────────────
          #   KR 장중 00:22~06:45 UTC → 45분 (00:00 첫 빌드에 22분 여유)
          #   US 장중 13:22~20:15 UTC → 45분 (13:00 첫 빌드에 22분 여유)
          #   마감후 배치 22:00~23:59 UTC → 150분 (전체 백필은 오래 걸림)
          #   그 외(장외) → 검사 생략: 빌드가 없는 게 정상이라 정체≠고장
          h=$(date -u +%H); m=$(date -u +%M)
          hm=$(( 10#$h * 60 + 10#$m ))
          limit=0
          if   [ $hm -ge 22 ]  && [ $hm -le 405 ];  then limit=45
          elif [ $hm -ge 802 ] && [ $hm -le 1215 ]; then limit=45
          elif [ $hm -ge 1320 ]; then limit=150
          fi
          if [ "$limit" = "0" ]; then
            echo "장외(UTC ${h}:${m}) — 검사 생략(빌드 없는 시간의 정체는 정상)"
            exit 0
          fi

          html=$(curl -sf "${SITE}?cb=${GITHUB_RUN_ID}")
          # 시간대 무관 에폭초로 판정(data-ts="1700000000")
          ets=$(echo "$html" | grep -o 'data-ts="[0-9]\{9,\}"' | head -1 | grep -o '[0-9]\{9,\}')
          now=$(date +%s)
          stale=0; reason=""
          if [ -z "$ets" ]; then
            stale=1; reason="라이브 페이지 파싱 실패(응답 이상)"
          else
            age=$(( now - ets ))
            echo "라이브 나이: $((age/60))분 (data-ts=$ets, 임계 ${limit}분)"
            if [ "$age" -gt $(( limit * 60 )) ]; then
              stale=1; reason="라이브가 $((age/60))분째 정체(장중 임계 ${limit}분 초과)"
            fi
          fi

          if [ "$stale" = "1" ]; then
            echo "::warning::$reason → daily.yml 재실행"
            # update=top: 정체 원인이 '크론 드랍'이면 캐시 가격도 낡았으므로
            #   재배포만(none)으론 낡은 가격으로 매매하게 됨 → 데이터까지 갱신.
            gh workflow run daily.yml --repo "$GITHUB_REPOSITORY" \
              --ref "${GITHUB_REF_NAME}" -f update=top || echo "재실행 트리거 실패"
            # 텔레그램 경고(토큰 있으면) — 조용한 멈춤 방지
            if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
              msg="🚨 자동매매 워치독 경보%0A${reason}%0A→ daily.yml 자동 재실행함. 계속되면 확인 필요."
              curl -sf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                -d "chat_id=${TG_CHAT}" -d "text=${msg}" >/dev/null \
                && echo "텔레그램 경고 발송" || echo "텔레그램 발송 실패"
            fi
            exit 0
          fi
          echo "→ 정상(신선) — 조치 없음"
