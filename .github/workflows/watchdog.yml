name: freshness-watchdog

# 자가치유 + 경보: 라이브가 너무 오래됐으면(배포 실패·크론 지연·paths 공백 등 원인
#   불문) daily.yml을 자동 재실행하고, 텔레그램으로도 알린다.
#   "자동매매가 조용히 멈추는 것"을 막는 안전망 — 멈추면 반드시 알림이 온다.
# 신선도 판정: index.html의 data-ts(에폭초, 시간대 무관)로 계산 → KST/UTC 혼동 없음.
# 검사 시간: 갱신 윈도 안에서만(윈도 밖엔 정상적으로 늙으므로 오탐 방지).
#   KR 장중 02-06 UTC / US 장중 15-22 UTC, 정각 피크를 피해 :07/:37.

on:
  schedule:
    - cron: "7,37 2-6,15-22 * * 1-5"
  workflow_dispatch:

permissions:
  actions: write        # daily.yml 재실행 트리거용

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 라이브 신선도 확인 → 오래되면 재배포 + 텔레그램 경고
        env:
          GH_TOKEN: ${{ github.token }}
          SITE: "https://easyseop.github.io/Stock-chart-analyze/index.html"
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          html=$(curl -sf "${SITE}?cb=${GITHUB_RUN_ID}")
          # 시간대 무관 에폭초로 판정(data-ts="1700000000")
          ets=$(echo "$html" | grep -o 'data-ts="[0-9]\{9,\}"' | head -1 | grep -o '[0-9]\{9,\}')
          now=$(date +%s)
          stale=0; reason=""
          if [ -z "$ets" ]; then
            stale=1; reason="라이브 페이지 파싱 실패(응답 이상)"
          else
            age=$(( now - ets ))
            echo "라이브 나이: $((age/60))분 (data-ts=$ets)"
            if [ "$age" -gt 6000 ]; then
              stale=1; reason="라이브가 $((age/60))분째 정체(>100분)"
            fi
          fi

          if [ "$stale" = "1" ]; then
            echo "::warning::$reason → daily.yml 재실행"
            # update=top: 정체 원인이 '크론 드랍'이면 캐시 가격도 낡았으므로
            #   재배포만(none)으론 낡은 가격으로 매매하게 됨 → 데이터까지 갱신.
            gh workflow run daily.yml --repo "$GITHUB_REPOSITORY" \
              --ref "${GITHUB_REF_NAME}" -f update=top || echo "재실행 트리거 실패"
            # 텔레그램 경고(토큰 있으면) — 조용한 멈춤 방지
            if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
              msg="🚨 자동매매 워치독 경보%0A${reason}%0A→ daily.yml 자동 재실행함. 계속되면 확인 필요."
              curl -sf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                -d "chat_id=${TG_CHAT}" -d "text=${msg}" >/dev/null \
                && echo "텔레그램 경고 발송" || echo "텔레그램 발송 실패"
            fi
            exit 0
          fi
          echo "→ 정상(신선) — 조치 없음"
