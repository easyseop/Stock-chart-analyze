name: daily-scan

# 자동화: 미국 장중·마감 후 자동 갱신(스케줄). 무한 연쇄 없음 — 안전.
#   대상: 미국주(S&P500 503) 전용. 미국주는 야후 막히면 Stooq 폴백이라 안정적.
#   한국주는 자동 수집 안 함 → lookup(수시 조회)으로 그때만 야후로.
#   장중 실행(15분마다): 증분 갱신(오늘 가격 반영)만 → 스크리너 → 배포(빠름, 백필 없음).
#     → '내 종목(매수)'·전환후보 지표가 장중 15분 단위로 최신화됨.
#     ※ 15분 = 막히지 않는 안전 최대치(데이터원=FDR은 Stooq/Naver 폴백이라 견고,
#       GitHub 스케줄도 15분은 안정적으로 실행. 동시성 그룹으로 밀려도 자동 정리).
#   마감후 실행: 백필(새 종목) + 증분 갱신 → 스크리너 → 배포.
#   백필: 매 실행 '아직 캐시 없는 종목 전부'를 받는다(CHUNK=9999). 한 번이면 유니버스 완성.
#   ※ 미국 서머타임(3~11월) 기준 개장 22:30·마감 05:00(KST). UTC 크론은 양 계절을
#     포괄하도록 배치(겨울엔 한 시간씩 밀려도 장중/마감 무렵에 걸침).
on:
  # 코드(파이썬·설정·이 워크플로)를 푸시하면 자동으로 재빌드·배포(데이터 갱신 없이 ~1~2분).
  #   → 코드 바꿀 때마다 수동으로 Run workflow 할 필요 없음.
  push:
    branches: ["claude/happy-gauss-cwoq21"]   # 기본 브랜치만(중복 실행 방지)
    paths:
      - "scanner/**"
      - "main.py"
      - "config.py"
      - ".github/workflows/daily.yml"
      - "trigger/**"     # 백업 스케줄러(클로드 예약 세션)의 강제 빌드 킥 전용 경로
  schedule:
    # ※ 주기를 바꾸면 config.UPDATE_INTERVAL_MIN(홈 안내문 표시값)도 함께 바꿀 것.
    # ★ 오프피크 분(:04/:19/:34/:49) 사용 — GitHub 스케줄러는 정각(:00/:15/:30/:45)
    #   피크에 이벤트를 지연·드랍한다(공식 문서 + 실측 2026-07-06: 정각 크론 전멸,
    #   오프피크 워치독만 발화). 15분 간격은 유지.
    - cron: "4,19,34,49 0-6 * * 1-5"    # 한국 장중(09~15:30 KST) 15분마다 — 한국주 갱신
    - cron: "4,19,34,49 13-20 * * 1-5"  # 미 장중 15분마다 증분 갱신 — 보유/후보 지표 최신화
    - cron: "9 22 * * 1-5"              # 마감 후: 백필 + 일일 정리(메인, 전체)
  workflow_dispatch:
    inputs:
      update:
        type: choice
        description: "데이터 갱신 범위 — none=재배포만 / fast=매매차선(보유·후보 시세→매매→피드, ~3분, 렌더 없음) / top=상위300 / kr=한국주 갱신+스크리너(국내 장중용) / full=전체(느림)"
        options: ["none", "fast", "top", "kr", "full"]
        default: "none"
      confirm:
        description: "full 실행 확인 — full일 때만 대문자로 FULL 입력(외부 킥의 무거운 모드 남발 방지)"
        default: ""
      backfill:
        description: "백필 묶음(update=full일 때만 적용, 미수집분 전부면 9999)"
        default: "9999"
      prune:
        description: "캐시 정리(수동 전용): 'korean' / 'illiquid:N' / 'CODE,CODE'. 비우면 안 함"
        default: ""

permissions:
  contents: write       # state 브랜치 계좌 백업 커밋용(그 외 쓰기 없음)
  pages: write
  id-token: write

# concurrency는 '잡 레벨'로 내렸다(build=pages, fast=trading-fast) — 워크플로
#   레벨이면 fast 차선까지 벌크 뒤에 줄을 서서 차선 분리(A1)가 무효가 된다.
#   계좌 정합성은 autopaper 매매 분산 락 + 스냅샷 최신성 채택(F8)이 담당.

env:
  TARGET: "3000"          # 스크리너 표시 상한(유니버스 확장 대비 넉넉히)
  CHUNK: "9999"           # 한 실행에 미수집분 전부 백필(백필=아직 없는 종목만 받음)

jobs:
  # ── 외부 킥 공회전 가드 ─────────────────────────────────────────
  #   외부 크론(PAT)이 15분마다 무조건 dispatch를 쏘는 구조에서:
  #   ① top 킥인데 라이브가 이미 신선(<20분)하면 → 빌드 생략(no-op).
  #      토큰이 유출돼 폭탄 dispatch가 와도 최악이 '공회전'으로 축소.
  #      ※ 임계=20분: 15분 주기 시스템의 '슬롯 보정'용. 40분이면 GitHub 크론이
  #        죽어도 40분간 '아직 신선'으로 no-op → 워치독 45분과 겹쳐 무의미.
  #        20분이면 크론이 한 슬롯 드랍한 즉시(다음 외부 킥에서) 보정된다.
  #   ② full은 confirm=FULL 명시 없이는 거부 — 무거운 모드 남발/오발사 방지.
  #   신선도 조회 실패 시엔 실행(fail-open) — 가드가 빌드를 막는 사고 방지.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        run: |
          run=1
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.update }}" = "full" ] && [ "${{ github.event.inputs.confirm }}" != "FULL" ]; then
              echo "::warning::full은 confirm=FULL 입력 필요 — 실행 거부"
              run=0
            elif [ "${{ github.event.inputs.update }}" = "fast" ]; then
              # fast는 Pages를 배포하지 않으므로 신선도는 'state 하트비트'로 판정
              #   (Pages signals는 벌크만 갱신 — 그걸 보면 fast가 헛돎/공회전 오판).
              #   ① 양 시장 모두 장외면 no-op(24/7 킥 낭비 방지)
              #   ② 마지막 실빌드가 12분 내면 no-op(중복 차선 방지)
              open=$(python3 -c "import datetime,zoneinfo;now=datetime.datetime.now(datetime.timezone.utc);kr=now.weekday()<5 and 0<=now.hour*60+now.minute<=390;et=now.astimezone(zoneinfo.ZoneInfo('America/New_York'));us=et.weekday()<5 and 9*60+30<=et.hour*60+et.minute<16*60;print(1 if (kr or us) else 0)")
              if [ "$open" != "1" ]; then
                echo "장외(한/미 모두 닫힘) — fast no-op"
                run=0
              else
                age=$(curl -sf "https://raw.githubusercontent.com/${{ github.repository }}/state/feed/heartbeat.json?cb=${GITHUB_RUN_ID}" \
                  | python3 -c 'import json,sys,datetime as d; t=d.datetime.fromisoformat(json.load(sys.stdin)["generated_at"]); print(int((d.datetime.now(t.tzinfo)-t).total_seconds()))' \
                  2>/dev/null || echo 999999)
                echo "하트비트 나이: $((age/60))분"
                if [ "$age" -lt 720 ]; then
                  echo "실빌드 신선(<12분) — fast no-op"
                  run=0
                fi
              fi
            elif [ "${{ github.event.inputs.update }}" = "top" ]; then
              age=$(curl -sf "https://easyseop.github.io/Stock-chart-analyze/api/signals.json?cb=${GITHUB_RUN_ID}" \
                | python3 -c 'import json,sys,datetime as d; t=d.datetime.fromisoformat(json.load(sys.stdin)["generated_at"]); print(int((d.datetime.now(t.tzinfo)-t).total_seconds()))' \
                2>/dev/null || echo 999999)
              echo "라이브 나이: $((age/60))분"
              if [ "$age" -lt 1200 ]; then
                echo "이미 신선(<20분) — 공회전 방지 no-op"
                run=0
              fi
            elif [ "${{ github.event.inputs.update }}" = "kr" ]; then
              # 국내 장중 갱신(워커가 국내 개장 중 발사) — 한국 폐장이면 no-op,
              #   최근 빌드가 신선(<12분)하면 no-op(공회전 방지). 네이티브 kr 크론과
              #   워커가 동시 발사해도 한쪽만 실제 실행되게.
              kopen=$(python3 -c "import datetime;now=datetime.datetime.now(datetime.timezone.utc);m=now.hour*60+now.minute;print(1 if now.weekday()<5 and 0<=m<=390 else 0)")
              if [ "$kopen" != "1" ]; then
                echo "한국 폐장 — kr no-op"; run=0
              else
                age=$(curl -sf "https://raw.githubusercontent.com/${{ github.repository }}/state/feed/heartbeat.json?cb=${GITHUB_RUN_ID}" \
                  | python3 -c 'import json,sys,datetime as d; t=d.datetime.fromisoformat(json.load(sys.stdin)["generated_at"]); print(int((d.datetime.now(t.tzinfo)-t).total_seconds()))' \
                  2>/dev/null || echo 999999)
                echo "하트비트 나이: $((age/60))분"
                if [ "$age" -lt 720 ]; then echo "신선(<12분) — kr no-op"; run=0; fi
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # ── 빠른 차선(fast) — 시세→매매→피드만 ~3분(L2 분리, RELIABILITY A1) ──────
  #   렌더·배포 없음. 벌크(pages 그룹)와 분리된 차선이라 렌더 정체(F4)에 안 막힘.
  #   계좌 정합성: autopaper 매매 분산 락 + state 스냅샷 최신성 채택(F8)이 보장.
  fast:
    needs: guard
    if: needs.guard.outputs.run == '1' && github.event_name == 'workflow_dispatch' && github.event.inputs.update == 'fast'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: trading-fast          # 벌크와 별개 차선(대기·취소 없이 독립 주행)
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            data_cache
            data_cache_h
            earnings_cache.json
          key: data-cache-${{ github.run_id }}
          restore-keys: |
            data-cache-
      - name: 빠른 차선 — 시세·매매·피드
        env:
          LANE: fast
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # P0 이중화(미설정=무동작)
          KILL_NEW_ENTRIES: ${{ vars.KILL_NEW_ENTRIES }}   # 긴급정지(변수 켜면 신규진입만 중단)
        run: python main.py --fast
      - name: 계좌 상태 백업(state 브랜치) + 매매 락 해제
        env:
          LANE: fast
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash scripts/state_backup.sh
      - name: 실패 알림
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] && exit 0
          curl -sf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "text=🚨 fast 차선 실패 (#${GITHUB_RUN_NUMBER}) — 이번 매매 사이클 미실행. 벌크 차선은 정상. 반복되면 점검." >/dev/null || true

  build:
    needs: guard
    if: needs.guard.outputs.run == '1' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.update == 'fast')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      has_public: ${{ steps.pubcheck.outputs.has_public }}   # 산출 없으면 배포 생략(deploy 게이트)
    concurrency:
      group: pages          # lookup·벌크 빌드 직렬화(동시 Pages 배포 충돌 방지)
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: |
            data_cache
            data_cache_h
            earnings_cache.json
          key: data-cache-${{ github.run_id }}
          restore-keys: |
            data-cache-

      # 상세페이지(≈900MB) 증분 렌더용 — 이전 빌드 산출물 보존, 바뀐 종목만 다시 그림
      - uses: actions/cache@v4
        with:
          path: public/stocks
          key: detail-pages-${{ github.run_id }}
          restore-keys: |
            detail-pages-

      # 갱신 범위: push(코드변경)=none(재배포만) / 마감후 스케줄=전체 / 장중 스케줄=상위300 /
      #   수동(dispatch)=입력값(none=재배포만·top=상위300·full=전체). none이면 데이터 안 받음 → 1~2분.
      # push는 기본 재배포만(none). 단 커밋 메시지에 [update-top]이 있으면 top —
      #   GitHub 스케줄러가 크론을 드랍하는 날(실측: 미장 개장 후 1시간+ 무실행)
      #   푸시로 신선한 데이터 빌드를 강제할 수 있는 탈출구(dispatch는 토큰 403).
      - name: 데이터 갱신 (범위별)
        env:
          MODE: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[update-top]') && 'top' || 'none') || (github.event_name == 'workflow_dispatch' && github.event.inputs.update || (github.event.schedule == '9 22 * * 1-5' && 'full' || (github.event.schedule == '4,19,34,49 0-6 * * 1-5' && 'kr' || 'top'))) }}
        run: |
          echo "갱신 모드: $MODE"
          # ── 자가치유(브랜치 시딩): actions/cache는 브랜치-스코프라 기본 브랜치를
          #   교체하면 새 브랜치의 캐시가 비어 있다(실측 2026-07-20: 교체 후 캐시 0종목
          #   → 분석 산출 없음 → public 미생성 → upload-pages tar 실패 → '빌드 실패' 스팸).
          #   MODE와 무관하게, 캐시가 사실상 비어 있으면(<50종목) 1회 전체 백필로 시딩.
          #   시딩 후엔 actions/cache가 캐시를 지속시켜 다음 실행부터 정상(top/none).
          CACHED=$(python -c "from scanner import cache; print(len(cache.cached_codes()))" 2>/dev/null || echo 0)
          if [ "${CACHED:-0}" -lt 50 ]; then
            echo "캐시 비어있음(${CACHED}종목) — 새 브랜치 시딩용 전체 백필 강제(1회, 이후 지속)"
            python main.py --backfill "${{ env.CHUNK }}" || true
            python main.py --update || true
          fi
          if [ "$MODE" = "full" ]; then
            python main.py --backfill "${{ github.event.inputs.backfill || env.CHUNK }}"
            python main.py --update
            python main.py --fix-names || true   # 즉석조회 종목명 보정(코드→실제명, best-effort)
          elif [ "$MODE" = "kr" ]; then
            python main.py --update-kr   # 한국 장중: 한국주(우량주+즉석조회) 일봉 갱신
          elif [ "$MODE" = "top" ]; then
            python main.py --update-top 600   # 미국 유니버스 전체 포함(보유 종목도 갱신)
          else
            echo "재배포만 — 데이터 갱신 건너뜀(캐시 그대로 사용)"
          fi

      # 캐시 정리는 백필 '후'에 — illiquid:N(거래대금 상위만)은 캐시가 채워진 뒤 평가해야 정확.
      - name: 캐시 정리(수동 입력 시에만 — korean / illiquid:N / 종목코드)
        if: ${{ github.event.inputs.prune != '' }}
        run: python main.py --prune "${{ github.event.inputs.prune }}"

      # 어닝 발표일: 마감후 스케줄 또는 수동 full에서만(하루 1회 충분). 실패해도 무시.
      - name: 어닝 발표일 갱신(best-effort)
        if: ${{ github.event.schedule == '9 22 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.update == 'full') }}
        # timeout: 외부 API 행이 빌드 잡 전체(120분)를 태우고 후속 빌드까지
        #   연쇄 취소시킨 2026-08-07 피드 정체 재발 방지. 내부 시간 예산
        #   (EARNINGS_BUDGET_S)이 먼저 걸려 진행분 저장 후 정상 종료하는 게
        #   기본 경로고, 셸 timeout은 단일 호출이 무한 행일 때의 최후 방어선.
        run: timeout -k 30 720 python main.py --update-earnings || true

      # 시간봉: 데이터 갱신을 하는 실행에서만(push/none이면 건너뜀). 상위 80종목.
      - name: 시간봉(60분) 갱신(전환후보 상위, best-effort)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.update != 'none') }}
        run: timeout -k 30 720 python main.py --update-hourly 80 || true

      - name: 스크리너 생성(캐시 전체 — 즉석조회 추가분 포함, 네트워크 0)
        env:
          BUILD_SHA: ${{ github.sha }}   # 같은 코드면 증분 렌더, 코드 바뀌면 전체 재렌더
          # 코드 push는 사이트 재배포 전용: 모의계좌·락·상태·알림을 건드리지 않는다.
          # 정기/수동 데이터·매매 실행만 실제 알림 자격증명을 받는다.
          AUTOPAPER_READ_ONLY: ${{ github.event_name == 'push' && '1' || '0' }}
          TELEGRAM_BOT_TOKEN: ${{ github.event_name != 'push' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ github.event_name != 'push' && secrets.TELEGRAM_CHAT_ID || '' }}
          NTFY_TOPIC: ${{ github.event_name != 'push' && secrets.NTFY_TOPIC || '' }}
          NOTIFY_MODE: trade_only
          KILL_NEW_ENTRIES: ${{ vars.KILL_NEW_ENTRIES }}   # 긴급정지(변수 켜면 신규진입만 중단)
        run: python main.py --cache --scan-cached --screener --screener-dir public

      # ── 계좌 상태 영구 백업(state 브랜치) — actions/cache 밖의 source of truth ──
      #   cache는 경합·7일 소멸·임의 evict 위험(실측: 즉석조회 소실 사고).
      #   매 빌드 후 스냅샷 + 월별 append-only 원장 + 기계용 feed를 state 브랜치에
      #   커밋 — 계좌 리셋 사고 원천 차단 + 매매 이력 감사 가능.
      #   실패해도 빌드는 계속(::warning) — 다음 빌드가 재시도.
      - name: 계좌 상태 백업(state 브랜치) + 매매 락 해제
        if: github.event_name != 'push'
        env:
          LANE: bulk
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash scripts/state_backup.sh

      - name: 진행 현황(로그용)
        run: |
          python -c "from scanner import universe,cache; u=[s for s in universe.load() if s.get('code')][:${{ env.TARGET }}]; rem=sum(1 for s in u if not cache.is_cached(s['code'])); print(f'캐시 {len(cache.cached_codes())}종목 · 남은 백필 {rem} (다음 실행/재실행 때 이어서 채움)')"

      # 산출 확인: public이 없으면(분석 결과 0 등) 배포/업로드를 '실패' 아닌 '생략'으로.
      #   예전엔 public 부재 시 upload-pages의 tar가 exit 2로 죽어 '빌드 실패' 스팸이
      #   반복됐다(2026-07-20). 자가치유 백필과 이중 방어 — 스팸 클래스 자체를 봉인.
      - name: 산출(public) 확인
        id: pubcheck
        run: |
          if [ -f public/index.html ]; then
            echo "has_public=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::public/index.html 없음(분석 산출 0) — 이번 배포 생략(빌드는 성공 유지)"
            echo "has_public=0" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.pubcheck.outputs.has_public == '1'
        with:
          path: public

      # 빌드 실패 시 텔레그램 즉시 알림 — 자동매매 파이프라인이 '조용히' 죽는 것 방지.
      #   (실측 2026-07-06: 배포 실패를 사람이 물어봐서야 발견 → 실패는 시스템이 먼저 알린다)
      - name: 빌드 실패 알림
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] && exit 0
          curl -sf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "text=🚨 빌드 실패 (daily #${GITHUB_RUN_NUMBER}) — 자동매매 이번 회차 미실행. 반복되면 점검 필요." \
            >/dev/null || true

  deploy:
    needs: build
    if: needs.build.outputs.has_public == '1'   # 산출 없으면 배포 생략(아티팩트 부재 실패 방지)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true   # 일시 오류('try again later')면 아래에서 1회 재시도
        with:
          # Pages 배포 큐 정체(잦은 배포로 한도 근접) 시 10분 기본값으론 타임아웃
          #   → 20분으로 여유. 그래도 실패하면 다음 스케줄 런이 자동 재배포.
          timeout: 1200000
      # Pages 서버 일시 오류 대비 재시도(1회) — 첫 시도 성공이면 건너뜀.
      #   'try again later'류 장애는 수십 초 안에 안 풀림(실측: 37초 간격 재시도
      #   연속 실패) → 재시도 전 90초 대기.
      - if: steps.deploy.outcome == 'failure'
        run: sleep 90
      - id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
      # 배포 후 라이브 스모크체크 — 페이지가 실제로 뜨고 핵심 섹션이 있는지 확인.
      #   (빌드 전 gates.audit = 사전 차단, 이 단계 = 사후 검증. 실패 시 워크플로가
      #    빨간불이 되어 배포 사고를 바로 알 수 있음)
      - name: 라이브 스모크체크
        run: |
          sleep 15
          URL="${{ steps.deploy.outputs.page_url }}"
          curl -sf "${URL}?cb=${{ github.run_id }}" -o /tmp/live.html
          # 리디자인 후 홈의 안정적 마커로 검증(옛 '마지막 갱신/클로드라면'은 더보기로 이동/삭제됨)
          grep -q "전환 스크리너" /tmp/live.html
          grep -q 'id="rowsrc"' /tmp/live.html
          echo "라이브 정상: $URL"

      # 배포 실패(재시도 포함) 시 텔레그램 알림 — 매매는 빌드에서 이미 완결됐고
      #   웹만 낡는 상황임을 사용자에게 알린다(사이트가 멈춘 걸로 오해 방지).
      - name: 배포 실패 알림
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] && exit 0
          curl -sf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "text=⚠️ 웹 배포 실패 (Pages 장애 추정) — 매매·알림은 정상 동작, 사이트 표시만 지연. 다음 빌드가 자동 재시도." \
            >/dev/null || true
