name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q bot scanner

      - name: Strategy invariants
        run: python -m tests.test_gate_audit

      - name: Standalone regression suite
        shell: bash
        run: |
          for test in tests/test_*.py; do
            module="${test%.py}"
            module="${module//\//.}"
            python -m "$module"
          done
