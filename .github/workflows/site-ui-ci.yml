name: Site UI CI

on:
  pull_request:
    paths:
      - ".github/workflows/site-ui-ci.yml"
      - "README.md"
      - "bot/portfolio_web.py"
      - "scanner/screener.py"
      - "scanner/siteapp.py"
      - "scanner/site_app/**"
      - "tests/test_site_app.py"
      - "tests/site_math.test.js"
      - "tests/site_preview.py"
  push:
    paths:
      - ".github/workflows/site-ui-ci.yml"
      - "README.md"
      - "bot/portfolio_web.py"
      - "scanner/screener.py"
      - "scanner/siteapp.py"
      - "scanner/site_app/**"
      - "tests/test_site_app.py"
      - "tests/site_math.test.js"
      - "tests/site_preview.py"

permissions:
  contents: read

concurrency:
  group: site-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and test
        run: |
          python -m compileall -q bot scanner tests
          python -m tests.test_site_app
          node --test tests/site_math.test.js
          node --check scanner/site_app/portfolio_math.js
          node --check scanner/site_app/app.js

      - name: Static build
        run: |
          python -m scanner.siteapp --out-dir /tmp/site-build
          test -f /tmp/site-build/app/index.html
          test -f /tmp/site-build/app/app.css
          test -f /tmp/site-build/app/portfolio_math.js
          test -f /tmp/site-build/app/app.js
          test -f /tmp/site-build/app/og.png
