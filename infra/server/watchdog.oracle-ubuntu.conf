[Service]
EnvironmentFile=
WorkingDirectory=/home/ubuntu/Stock-chart-analyze
Environment=BOT_REPO_DIR=/home/ubuntu/Stock-chart-analyze
# 저널이 파이프라 파이썬 stdout이 블록 버퍼링된다 — 수십 줄이 같은 초로 뭉쳐
# 찍혀 시간 기반 진단이 불가능했다(실측 2026-08-16). 즉시 기록으로 고정.
Environment=PYTHONUNBUFFERED=1
ExecStart=
# ★ set -a 필수. 단순 source는 파일 안에서 `export`가 붙은 줄만 자식 파이썬에
#   전달한다. Oracle의 /home/ubuntu/kis.env는 혼합 형식이라 KIS_* 는 넘어가고
#   TELEGRAM_BOT_TOKEN·TELEGRAM_CHAT_ID는 넘어가지 않았다 — watchdog의 P0
#   경보가 전부 `[드라이런]`으로 저널에만 찍히고 폰에는 오지 않았다
#   (실측 2026-08-17). buyloop drop-in이 같은 이유로 이미 set -a를 쓴다.
ExecStart=/bin/bash -lc 'set -a; source /home/ubuntu/kis.env; set +a; exec /usr/bin/python3 infra/server/watchdog.py'
