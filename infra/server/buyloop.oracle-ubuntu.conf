[Service]
# Oracle의 /home/ubuntu/kis.env에는 시크릿뿐 아니라 영속 원장 경로 같은 일반
# KEY=VALUE도 있다. 단순 source는 기존에 export된 키만 자식 Python에 전달하므로
# set -a로 전부 export한 뒤 실행해야 readiness와 실제 buyloop가 같은 환경을 본다.
ExecStart=
ExecStart=/bin/bash -lc 'set -a; source /home/ubuntu/kis.env; set +a; exec /home/ubuntu/Stock-chart-analyze/.venv/bin/python -m bot.kis_buyloop --loop'
