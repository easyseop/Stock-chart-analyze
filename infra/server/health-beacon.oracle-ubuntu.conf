[Timer]
# ★ 빈 값으로 한 번 리셋해야 한다. systemd의 OnUnitActiveSec= 은 **누적 목록**이라
#   리셋 없이 값만 추가하면 기존 5min과 60min이 공존하고, 타이머는 그중 가장
#   이른 것에 발화한다 — 간격을 늘렸다고 믿는데 실제로는 그대로 5분마다 돈다.
OnUnitActiveSec=
# ntfy 무료 한도는 토픽이 아니라 발신 IP 기준 하루 ~250건이다. 5분 비콘 하나가
#   288건/일로 한도를 혼자 넘겼고, 오후엔 전 발행처가 429로 조용히 실패해
#   ops 스냅샷(원격 진단의 유일한 창구)까지 같이 죽었다(실측 2026-08-21).
#   비콘 내용은 ops 스냅샷과 겹치는 이중 신호라 가장 길게 잡는다.
OnUnitActiveSec=60min
